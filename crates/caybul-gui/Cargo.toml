[package]
name = "caybul-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caybul desktop app: transfer anything between two devices over a cable"

[[bin]]
name = "caybul-gui"
path = "src/main.rs"

[dependencies]
caybul-core = { path = "../caybul-core" }
anyhow = "1"
eframe = "0.31"
rfd = "0.15"

# Unconditional so it's present when cross-compiling to Windows from another
# host too; build.rs only invokes it when the target OS is Windows.
[build-dependencies]
winresource = "0.1"
